{% extends "base.html" %}
{% block content %}

<div class="card">
    <h1>{{ contact_title }}</h1>

    <p><strong>Email:</strong> {{ contact_email }}</p>
    <p><strong>Phone:</strong> {{ contact_phone }}</p>
    <p><strong>Address:</strong> {{ contact_address }}</p>
</div>

{% if contact_extra %}
<div class="card">
    <p>{{ contact_extra }}</p>
</div>
{% endif %}

{% endblock %}
