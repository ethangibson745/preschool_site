{% extends "base.html" %}
{% block content %}

<div class="card contact-card">
    <h1>{{ contact_title }}</h1>

    <p class="contact-item">
        <i class="fa-solid fa-envelope contact-icon"></i>
        <strong>Email:</strong>
        <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
    </p>

    <p class="contact-item">
        <i class="fa-solid fa-phone contact-icon"></i>
        <strong>Phone (session time only):</strong>
        <a href="tel:{{ contact_phone }}">{{ contact_phone }}</a>
    </p>

    <p class="contact-item">
        <i class="fa-solid fa-location-dot contact-icon"></i>
        <strong>Address:</strong>
        {{ contact_address }}
    </p>

    <div class="map-embed">
        <iframe
            width="100%"
            height="300"
            style="border:0; border-radius: 12px;"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q={{ contact_address | urlencode }}&output=embed">
        </iframe>
    </div>

    <!-- FACEBOOK EMBED -->
    <div class="card" style="margin-top: 20px;">
        <h2>Find us on Facebook</h2>

        <div class="fb-page"
             data-href="https://www.facebook.com/HopscotchPreschoolPlayschoolCastleDonington"
             data-tabs=""
             data-width="380"
             data-height=""
             data-small-header="false"
             data-adapt-container-width="true"
             data-hide-cover="false"
             data-show-facepile="true">
        </div>
    </div>

</div>

{% if contact_extra %}
<div class="card">
    <p>{{ contact_extra | replace('\n', '<br>') | safe }}</p>
</div>
{% endif %}

<div class="section-divider"></div>

{% endblock %}
