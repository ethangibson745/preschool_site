{% extends "base.html" %}
{% block content %}

<div class="card">
    <h1>{{ gallery_title }}</h1>
    <p>Take a look at some moments from Hopscotch Preschool.</p>
</div>

<div class="grid">
    {% for img in gallery_images %}
        <div class="card">
            <img src="{{ img }}" alt="Gallery Image" class="gallery-img">
        </div>
    {% endfor %}
</div>

{% endblock %}
