{% extends "base.html" %}
{% block content %}

<div class="card">
    <h1>{{ about_title }}</h1>

    <div class="about-section">
        <p>{{ about_paragraph | replace('\n', '<br>') | safe }}</p>
    </div>
</div>

<div class="card" style="margin-top: 20px;">
    <h2>Our Ofsted Report</h2>
    <p>
        You can read our latest Ofsted inspection report using the link below:
    </p>
    <p class="contact-item">
        <i class="fa-solid fa-file-lines contact-icon"></i>
        <strong>Ofsted Report:</strong>
        <a href="https://files.ofsted.gov.uk/v1/file/50283489" target="_blank">
            View our Ofsted report
        </a>
    </p>
</div>


<div class="card" style="margin-top: 20px;">
    <h2>Our Calendar</h2>

    <iframe 
        src="https://calendar.google.com/calendar/embed?src=websitecallander%40gmail.com&ctz=Europe%2FLondon"
        style="border:0; border-radius: 12px;"
        width="100%" 
        height="600" 
        frameborder="0" 
        scrolling="no">
    </iframe>
</div>


<div class="section-divider"></div>

{% endblock %}
